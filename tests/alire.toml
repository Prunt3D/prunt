[[pins]]
prunt = { path='..' }

[build-profiles]
prunt = "development"

[[depends-on]]
trendy_test = "~0.0.4"

[[pins]]
trendy_test = { url = "https://github.com/Prunt3D/trendy_test.git" }

[configuration.values]
prunt.enable_test_mocks = true
